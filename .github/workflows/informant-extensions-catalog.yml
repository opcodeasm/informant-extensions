name: Extension download catalog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.i7x'
      - 'catalog/**'
      - 'tools/generate_catalog.py'
      - 'tests/test_catalog.py'
      - '.github/workflows/extension-catalog.yml'

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dependency extraction
        run: python3 -m unittest discover -s tests -v
      - name: Check committed catalog on pull requests
        if: github.event_name == 'pull_request'
        run: python3 tools/generate_catalog.py --check
      - name: Generate catalog for selected branch and repository
        if: github.event_name == 'workflow_dispatch'
        env:
          CATALOG_REPOSITORY: ${{ github.repository }}
          CATALOG_REF: ${{ github.ref_name }}
        run: python3 tools/generate_catalog.py --repository "$CATALOG_REPOSITORY" --ref "$CATALOG_REF"
      - name: Validate XML against XSD
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout --schema catalog/extensions.xsd catalog/extensions.xml
      - name: Export catalog files
        uses: actions/upload-artifact@v4
        with:
          name: extension-catalog
          path: |
            catalog/extensions.xml
            catalog/extensions.xsd
            catalog/README.md
          if-no-files-found: error
